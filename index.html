<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Водица</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0061a4">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        });
      });
    }
  </script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- SortableJS & QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f5f9;
      --card-bg: #ffffff;
      --text-color: #1c1b1f;
      --text-sub: #606060;
      --primary: #0061a4;
      --primary-container: #d1e4ff;
      --on-primary: #ffffff;
      --border-color: #e0e2ec;
      --shadow: 0 2px 6px rgba(0,0,0,0.06);
      --card-radius: 8px;
      --transition: all 0.2s ease-in-out;
    }

    body.dark-mode {
      --bg-color: #121316;
      --card-bg: #1e1f23;
      --text-color: #e2e2e6;
      --text-sub: #8e9099;
      --primary: #a8c7ff;
      --primary-container: #004778;
      --on-primary: #003052;
      --border-color: #2e3036;
      --shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Анимация обновления при свайпе */
    #pull-refresh {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      height: 32px;
      width: 32px;
      background: var(--card-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: top 0.2s ease;
    }

    #pull-refresh svg {
      width: 18px;
      height: 18px;
      fill: var(--primary);
    }

    header {
      background: var(--card-bg);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      z-index: 10;
    }

    /* Прозрачная кнопка курьера */
    .courier-select-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--card-radius);
      transition: var(--transition);
    }
    .courier-select-btn:active {
      opacity: 0.6;
    }
    .courier-select-btn svg {
      width: 12px;
      height: 12px;
      fill: var(--text-color);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      width: 36px;
      height: 36px;
      border-radius: var(--card-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .icon-btn:active {
      background: var(--border-color);
      transform: scale(0.95);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--text-color);
    }

    /* Список заказов */
    #orders-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .order-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 10px 12px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      animation: fadeIn 0.2s ease-out;
      transition: var(--transition);
    }

    .order-card:active {
      transform: scale(0.99);
    }

    .order-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .order-address {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-color);
    }

    .order-desc {
      font-size: 13px;
      color: var(--text-sub);
    }

    .order-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .order-count {
      font-size: 13px;
      background: var(--primary-container);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .order-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      width: 100%;
      max-width: 360px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transform: translateY(10px);
      transition: var(--transition);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--card-radius);
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-sub);
    }

    .btn-danger {
      background: #ba1a1a;
      color: #ffffff;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.96);
    }

    #qrcode-container {
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: var(--card-radius);
      background: var(--primary);
      color: var(--on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: none;
      transition: var(--transition);
    }
    .fab:active {
      transform: scale(0.9);
    }
    .fab svg {
      width: 24px;
      height: 24px;
      fill: var(--on-primary);
    }
  </style>
</head>
<body>

  <div id="pull-refresh">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
  </div>

  <header>
    <button class="courier-select-btn" id="courierBtn">
      <span id="currentCourierName">Курьер 1</span>
      <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
    <div class="header-actions">
      <!-- Иконка Поделиться (QR-код) -->
      <button class="icon-btn" id="qrBtn" title="QR-код">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
      </button>
      <!-- Иконка Шестеренка (Настройки) -->
      <button class="icon-btn" id="settingsBtn" title="Настройки">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </header>

  <div id="orders-container"></div>

  <button class="fab" id="addOrderBtn">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>

  <!-- Модальное окно заказа -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal">
      <div class="modal-title" id="orderModalTitle">Новый заказ</div>
      <div class="form-group">
        <label>Адрес</label>
        <input type="text" class="form-control" id="orderAddress" placeholder="Улица, дом, кв">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <input type="text" class="form-control" id="orderDesc" placeholder="Заметки">
      </div>
      <div class="form-group">
        <label>Количество (шт)</label>
        <input type="number" class="form-control" id="orderCount" value="1">
      </div>
      <div class="form-group">
        <label>Цена (ручная)</label>
        <input type="number" class="form-control" id="orderPrice" placeholder="0">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelOrderBtn">Отмена</button>
        <button class="btn btn-primary" id="saveOrderBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Контекстное меню заказа -->
  <div class="modal-overlay" id="contextModal">
    <div class="modal">
      <div class="modal-title">Действия с заказом</div>
      <div class="modal-actions" style="flex-direction: column; gap: 8px;">
        <button class="btn btn-primary" id="ctxEditBtn">Редактировать</button>
        <button class="btn btn-danger" id="ctxDeleteBtn">Удалить заказ</button>
        <button class="btn btn-secondary" id="ctxCloseBtn">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модалка QR-кода -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal">
      <div class="modal-title">QR-код приложения</div>
      <div id="qrcode-container"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeQrBtn">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модалка Настроек -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-title">Настройки</div>
      <div class="form-group">
        <label>Авто-синхронизация</label>
        <select class="form-control" id="syncIntervalSelect">
          <option value="5000">Каждые 5 секунд</option>
          <option value="60000">Раз в минуту</option>
          <option value="0">Отключить</option>
        </select>
      </div>
      <div class="form-group">
        <label>Тёмная тема</label>
        <select class="form-control" id="themeSelect">
          <option value="light">Светлая</option>
          <option value="dark">Тёмная</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="closeSettingsBtn">Готово</button>
      </div>
    </div>
  </div>

  <!-- Модалка Выбора Курьера -->
  <div class="modal-overlay" id="courierModal">
    <div class="modal">
      <div class="modal-title">Выберите курьера</div>
      <div class="form-group">
        <select class="form-control" id="courierSelect">
          <option value="Курьер 1">Курьер 1</option>
          <option value="Курьер 2">Курьер 2</option>
          <option value="Курьер 3">Курьер 3</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="closeCourierBtn">Применить</button>
      </div>
    </div>
  </div>

  <script>
    // Тестовая/Локальная конфигурация базы Firebase
    const firebaseConfig = {
      databaseURL: "https://vodica-default-rtdb.firebaseio.com/"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch(e) {
      console.log("Firebase не подключен, синхронизация работает локально.");
    }

    // Состояние приложения
    let appState = {
      courier: localStorage.getItem('v_courier') || 'Курьер 1',
      syncInterval: parseInt(localStorage.getItem('v_sync') || '5000'),
      theme: localStorage.getItem('v_theme') || 'light',
      orders: JSON.parse(localStorage.getItem('v_orders_local') || '[]')
    };

    let selectedOrderId = null;
    let editingOrderId = null;
    let syncTimer = null;

    // Применение темы
    function applyTheme() {
      if (appState.theme === 'dark') {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }
    applyTheme();

    document.getElementById('currentCourierName').innerText = appState.courier;
    document.getElementById('syncIntervalSelect').value = appState.syncInterval;
    document.getElementById('themeSelect').value = appState.theme;
    document.getElementById('courierSelect').value = appState.courier;

    // Получение и сохранение данных
    function fetchFromFirebase() {
      localStorage.setItem('v_orders_local', JSON.stringify(appState.orders));
      if (!db) { renderOrders(); return; }

      db.ref('orders/' + appState.courier).once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          appState.orders = Array.isArray(data) ? data : Object.values(data);
          localStorage.setItem('v_orders_local', JSON.stringify(appState.orders));
        }
        renderOrders();
      }).catch(() => {
        renderOrders();
      });
    }

    function saveToFirebase() {
      localStorage.setItem('v_orders_local', JSON.stringify(appState.orders));
      if (db) {
        db.ref('orders/' + appState.courier).set(appState.orders);
      }
    }

    function setupAutoSync() {
      if (syncTimer) clearInterval(syncTimer);
      if (appState.syncInterval > 0) {
        syncTimer = setInterval(() => {
          fetchFromFirebase();
        }, appState.syncInterval);
      }
    }

    // Отрисовка карточек заказов
    const ordersContainer = document.getElementById('orders-container');

    function renderOrders() {
      ordersContainer.innerHTML = '';
      appState.orders.forEach((order) => {
        const card = document.createElement('div');
        card.className = 'order-card';
        card.dataset.id = order.id;

        card.innerHTML = `
          <div class="order-info">
            <div class="order-address">${escapeHtml(order.address || 'Без адреса')}</div>
            ${order.desc ? `<div class="order-desc">${escapeHtml(order.desc)}</div>` : ''}
          </div>
          <div class="order-meta">
            <div class="order-count">${order.count || 1} шт</div>
            <div class="order-price">${order.price || 0} ₽</div>
          </div>
        `;

        // Двойной быстрый тап (< 1000мс)
        let lastTap = 0;
        card.addEventListener('touchend', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          if (tapLength < 1000 && tapLength > 0) {
            openContextMenu(order.id);
            e.preventDefault();
            lastTap = 0;
          } else {
            lastTap = currentTime;
          }
        });

        // Двойной клик на ПК
        card.addEventListener('dblclick', () => {
          openContextMenu(order.id);
        });

        ordersContainer.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    // Сортировка Drag and Drop
    new Sortable(ordersContainer, {
      animation: 150,
      onEnd: () => {
        const updated = [];
        document.querySelectorAll('.order-card').forEach(el => {
          const id = el.dataset.id;
          const found = appState.orders.find(o => o.id == id);
          if (found) updated.push(found);
        });
        appState.orders = updated;
        saveToFirebase();
      }
    });

    // Pull-to-refresh (Свайп вниз для обновления)
    let touchStartY = 0;
    const pullRefreshEl = document.getElementById('pull-refresh');

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        touchStartY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      const touchY = e.touches[0].clientY;
      const diff = touchY - touchStartY;
      if (diff > 0 && window.scrollY === 0) {
        pullRefreshEl.style.top = Math.min(diff / 2.5 - 45, 15) + 'px';
      }
    });

    window.addEventListener('touchend', () => {
      if (parseInt(pullRefreshEl.style.top) >= 10) {
        fetchFromFirebase();
      }
      pullRefreshEl.style.top = '-45px';
    });

    // Управление модальными окнами
    function toggleModal(id, show) {
      const modal = document.getElementById(id);
      if (show) modal.classList.add('active');
      else modal.classList.remove('active');
    }

    // Создание / Редактирование заказа
    document.getElementById('addOrderBtn').onclick = () => {
      editingOrderId = null;
      document.getElementById('orderModalTitle').innerText = 'Новый заказ';
      document.getElementById('orderAddress').value = '';
      document.getElementById('orderDesc').value = '';
      document.getElementById('orderCount').value = '1';
      document.getElementById('orderPrice').value = '';
      toggleModal('orderModal', true);
    };

    document.getElementById('cancelOrderBtn').onclick = () => toggleModal('orderModal', false);

    document.getElementById('saveOrderBtn').onclick = () => {
      const address = document.getElementById('orderAddress').value.trim();
      const desc = document.getElementById('orderDesc').value.trim();
      const count = parseInt(document.getElementById('orderCount').value) || 1;
      const price = parseInt(document.getElementById('orderPrice').value) || 0;

      if (!address) return;

      if (editingOrderId) {
        const idx = appState.orders.findIndex(o => o.id == editingOrderId);
        if (idx !== -1) {
          appState.orders[idx] = { ...appState.orders[idx], address, desc, count, price };
        }
      } else {
        appState.orders.push({
          id: Date.now(),
          address,
          desc,
          count,
          price
        });
      }

      saveToFirebase();
      renderOrders();
      toggleModal('orderModal', false);
    };

    // Контекстное меню
    function openContextMenu(id) {
      selectedOrderId = id;
      toggleModal('contextModal', true);
    }

    document.getElementById('ctxCloseBtn').onclick = () => toggleModal('contextModal', false);

    document.getElementById('ctxDeleteBtn').onclick = () => {
      appState.orders = appState.orders.filter(o => o.id != selectedOrderId);
      saveToFirebase();
      renderOrders();
      toggleModal('contextModal', false);
    };

    document.getElementById('ctxEditBtn').onclick = () => {
      toggleModal('contextModal', false);
      const order = appState.orders.find(o => o.id == selectedOrderId);
      if (order) {
        editingOrderId = order.id;
        document.getElementById('orderModalTitle').innerText = 'Редактировать заказ';
        document.getElementById('orderAddress').value = order.address || '';
        document.getElementById('orderDesc').value = order.desc || '';
        document.getElementById('orderCount').value = order.count || 1;
        document.getElementById('orderPrice').value = order.price || 0;
        toggleModal('orderModal', true);
      }
    };

    // QR-код
    document.getElementById('qrBtn').onclick = () => {
      const qrContainer = document.getElementById('qrcode-container');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: window.location.href,
        width: 180,
        height: 180
      });
      toggleModal('qrModal', true);
    };
    document.getElementById('closeQrBtn').onclick = () => toggleModal('qrModal', false);

    // Настройки
    document.getElementById('settingsBtn').onclick = () => toggleModal('settingsModal', true);
    document.getElementById('closeSettingsBtn').onclick = () => {
      appState.syncInterval = parseInt(document.getElementById('syncIntervalSelect').value);
      appState.theme = document.getElementById('themeSelect').value;

      localStorage.setItem('v_sync', appState.syncInterval);
      localStorage.setItem('v_theme', appState.theme);

      applyTheme();
      setupAutoSync();
      toggleModal('settingsModal', false);
    };

    // Выбор курьера
    document.getElementById('courierBtn').onclick = () => toggleModal('courierModal', true);
    document.getElementById('closeCourierBtn').onclick = () => {
      const val = document.getElementById('courierSelect').value;
      appState.courier = val;
      localStorage.setItem('v_courier', val);
      document.getElementById('currentCourierName').innerText = val;
      fetchFromFirebase();
      toggleModal('courierModal', false);
    };

    // Инициализация
    fetchFromFirebase();
    setupAutoSync();
  </script>
</body>
</html>
